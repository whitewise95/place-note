name: address_research_mobile
description: Flutter local MVP for extracting addresses from captured images and saving mock research reports.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.1
  http: ^1.6.0
  image: ^4.8.0
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
